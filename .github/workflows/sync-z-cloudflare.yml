# Když někdo nasadí web přímo na Cloudflare (např. Karlův blog-auto), tahle úloha
# stáhne živou verzi zpět do web/ a commitne ji. GitHub tak vždy odpovídá tomu, co je živě.
name: Sync z Cloudflare

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      vynutit:
        description: "Stáhnout živou verzi i tehdy, když vznikla z tohoto repa"
        type: boolean
        default: false

concurrency:
  group: sync-z-cloudflare
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install blake3==1.0.4

      - name: Stáhnout živou verzi, pokud vznikla mimo GitHub
        id: sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VYNUTIT: ${{ inputs.vynutit && '1' || '0' }}
        run: python nastroje/sync_z_cloudflare.py

      - name: Commit a push
        if: steps.sync.outputs.zmena == '1'
        env:
          ZPRAVA: ${{ steps.sync.outputs.zprava }}
        run: |
          git config user.name "mk-sync"
          git config user.email "mk-sync@users.noreply.github.com"
          git add -A web .cloudflare-posledni-sync
          git commit -m "$ZPRAVA"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
