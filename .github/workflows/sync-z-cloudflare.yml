# Když někdo nasadí web přímo na Cloudflare (např. Karlův blog-auto) nebo udělá rollback v dashboardu,
# tahle úloha stáhne živou verzi zpět do web/ a commitne ji. GitHub tak vždy odpovídá tomu, co je živě.
name: Sync z Cloudflare

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      vynutit:
        description: "Stáhnout živou verzi i tehdy, když je main napřed (živý web vyhraje)"
        type: boolean
        default: false

concurrency:
  group: sync-z-cloudflare
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

env:
  CLOUDFLARE_API_BASE_URL: https://mk-web-brana.msantiova.workers.dev/client/v4

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r nastroje/requirements.txt

      - name: Porovnat živý web s repem a případně stáhnout
        id: sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MK_BRANA_KLIC }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VYNUTIT: ${{ inputs.vynutit && '1' || '0' }}
          MK_CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
          GH_TOKEN: ${{ github.token }}
        run: python nastroje/sync_z_cloudflare.py

      - name: Commit a push
        id: push
        if: steps.sync.outputs.zmena == '1'
        env:
          ZPRAVA: ${{ steps.sync.outputs.zprava }}
          MK_CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
        run: |
          git config user.name "mk-sync"
          git config user.email "mk-sync@users.noreply.github.com"
          git add -A web .cloudflare-posledni-sync
          git commit -m "$ZPRAVA"
          # Žádný rebase: když se main mezitím pohnul, příští běh (za 10 min) porovná znovu od čerstvého stavu.
          if git push origin HEAD:main; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD~1)" ]; then
            echo "::warning::main se mezitím změnil, synchronizuji při dalším běhu"
            exit 0
          fi
          # main se nepohnul, a přesto push neprošel (ochrana větve, práva tokenu…) – to se samo nespraví
          zprava="Sync nemůže pushnout do main (ochrana větve nebo práva GITHUB_TOKEN). Repo přestalo odpovídat živému webu."
          echo "$zprava" >> "$MK_CHYBA_SOUBOR"
          echo "::error::$zprava"
          exit 1

      - name: Změny z GitHubu ke kontrole
        id: prepsano
        if: steps.push.outputs.ok == '1' && steps.sync.outputs.prepsano != ''
        env:
          PREPSANO: ${{ steps.sync.outputs.prepsano }}
          GH_TOKEN: ${{ github.token }}
          CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
        run: |
          zprava="Nasazení přímo na Cloudflare změnilo soubory, které se od poslední synchronizace měnily i přes GitHub: $PREPSANO. Repo teď odpovídá živému webu. Zkontroluj, jestli se tím neztratila změna z GitHubu (git log -p -- web/<soubor>). Často je to v pořádku (třeba blog-auto přegeneroval index.html z aktuálního main); když se něco ztratilo, doplň to do aktuální verze a pushni."
          echo "$zprava" >> "$CHYBA_SOUBOR"
          echo "::error::$zprava"
          # Vlastní issue a vždy nový komentář: seznam souborů se nesmí ztratit (příští běh už ho nespočítá).
          # Když založení issue selže, převezme to obecné upozornění níž.
          bash nastroje/upozorneni.sh "Nasazení na Cloudflare změnilo soubory i z GitHubu – zkontrolovat" vzdy \
            && echo "oznameno=1" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Udržet plánovanou úlohu zapnutou
        # GitHub vypíná plánované workflow po 60 dnech bez aktivity v repu. Jednou za den ho znovu zapneme
        # (v hodině 04 UTC, tj. při několika bězích – plánované běhy mívají zpoždění), i když sync selhává.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "04" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-z-cloudflare.yml/enable" && echo "workflow obnoveno"
          fi

      - name: Upozornění při chybě
        if: failure() && steps.prepsano.outputs.oznameno != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
        run: bash nastroje/upozorneni.sh "Sync z Cloudflare selhal"
