# Push do main = web je do minuty živě na modernikomunikace.com (Cloudflare Pages, projekt modernikomunikace).
name: Nasazení na Cloudflare

on:
  push:
    branches: [main]
    paths: ["web/**", "nastroje/**", ".github/workflows/nasazeni.yml"]
  workflow_dispatch:
    inputs:
      vynutit:
        description: "Nasadit i tak (přepíše nasazení zvenku, povolí velké zmenšení webu)"
        type: boolean
        default: false

concurrency:
  group: nasazeni-produkce
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # Do Cloudflare jen přes bránu: klíč umí číst a nasadit jen projekt modernikomunikace.
  CLOUDFLARE_API_BASE_URL: https://mk-web-brana.msantiova.workers.dev/client/v4
  WRANGLER_SEND_METRICS: "false"

jobs:
  nasadit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Nástroje (připnuté verze)
        run: |
          pip install --require-hashes -r nastroje/requirements.txt
          npm ci --prefix nastroje --ignore-scripts --no-audit --no-fund

      - name: Kontrola před nasazením
        id: pred
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MK_BRANA_KLIC }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRED_PUSHEM: ${{ github.event.before }}
          VYNUTIT: ${{ inputs.vynutit && '1' || '0' }}
          MK_CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
        run: python nastroje/kontrola_nasazeni.py pred

      - name: Nasadit na Cloudflare Pages (produkce)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MK_BRANA_KLIC }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZPRAVA: ${{ github.event.head_commit.message }}
        run: |
          nastroje/node_modules/.bin/wrangler pages deploy web \
            --project-name=modernikomunikace \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="github: $(printf '%s' "${ZPRAVA:-ruční nasazení}" | head -n1 | cut -c1-200)" \
            --commit-dirty=false

      - name: Ověřit, že doména servíruje tenhle commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MK_BRANA_KLIC }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZACATEK: ${{ steps.pred.outputs.zacatek }}
          MK_CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
        run: python nastroje/kontrola_nasazeni.py po

      - name: Upozornění při chybě
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CHYBA_SOUBOR: ${{ runner.temp }}/chyba.txt
        run: bash nastroje/upozorneni.sh "Nasazení na Cloudflare selhalo"
